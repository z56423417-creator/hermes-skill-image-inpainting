name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  smoke:
    name: smoke (${{ matrix.os }} / py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.11"
          - os: ubuntu-latest
            python: "3.12"
          - os: windows-latest
            python: "3.11"   # keeps the unicode-path / CRLF behaviour covered

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install deps (no torch — CI exercises the cv2 path)
        run: |
          python -m pip install --upgrade pip
          python -m pip install "opencv-python-headless>=4.9" "numpy>=1.24"

      - name: Byte-compile
        run: python -m compileall -q scripts tests

      - name: Smoke test
        # Asserts: 5 artifacts, mask coverage, pixels outside the mask unchanged,
        # watermark gone, unicode output paths, external --mask, SKILL.md frontmatter.
        # The LaMa path needs a 196 MB checkpoint + ~2 min CPU, so it stays manual:
        #   python scripts/remove_watermark.py in.jpg X0 Y0 X1 Y1 out
        run: python tests/smoke_test.py
